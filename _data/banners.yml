- id: "banner-cafe"
  title: "SakuRa Cafe 新規オープン告知バナー"
  img: "sakura-cafe.jpg"
  target: "動物好きな20〜40代の女性"
  purpose: "店舗の認知拡大と新規アクセスの獲得"
  points: "店名でもある桜をイメージしたサーモンピンクを基調とし、愛らしい猫の写真を配置。落ち着いたトーンの中に、新規オープンというワクワク感が伝わる配色を意識しました。"

- id: "banner-shampoo"
  title: "WCBシャンプー プロモーションバナー"
  img: "shampoo.jpg"
  target: "髪のパサつきや乾燥に悩む20〜30代の女性"
  purpose: "LP（ランディングページ）への誘導・クリック率向上"
  points: "「Webクリエイターボックス」のお題(https://www.webcreatorbox.com/blog/banner-design-10#h1002270aed)を元に制作。シャンプーのみずみずしさと清潔感を伝えるため、グリーンとホワイトのコントラストを活かし、キャッチコピーの視認性を最優先にレイアウトしました。"

- id: "banner-quirie"
  title: "脱毛サロンQuirie（キリエ）紹介キャンペーンバナー"
  img: "quirie.jpg"
  target: "サロンに通う既存会員とその友人（10〜20代女性）"
  purpose: "紹介キャンペーンの認知と、LINE公式アカウント等への登録促進"
  points: "上品さと親しみやすさを両立させるため、爽やかな色味と可愛らしいイラストを採用。「紹介特典」という最もユーザーのメリットになる数字の情報を大きく目立たせる工夫をしました。"

- id: "banner-workshop"
  title: "ワークショップ告知バナー"
  img: "workshop.jpg"
  target: "スパイスやカフェ巡りが好きな20〜30代の男女"
  purpose: "ワークショップへの参加申し込みとカフェの認知度向上"
  points: "チャイの温かみや本格的なスパイス感を表現するため、アースカラー（ブラウン・ベージュ）で統一。開催日時や場所などの重要な情報がパッと見で整理されて伝わるよう情報設計を行いました。"
