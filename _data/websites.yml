- id: "web-sakuracafe"
  title: "架空の保護猫カフェ「SakuRa Cafe」Webサイト"
  url: "https://sakura39-dev.github.io/sample-cafe"
  tools: "Figma / HTML5 / CSS3 / Jekyll / Git・GitHub"
  overview: "「猫と触れ合えるカフェで優しい癒しの時間を過ごしてほしい」というコンセプトのもと、ターゲット層の心に響く世界観を重視した架空の保護猫カフェのWebサイトです。当初はシンプルな静的HTML/CSSで構築し、その後に運用の効率化を見据えて静的サイトジェネレーター「Jekyll」へと移行・再構築を行いました。"
  mock: mock.png
  points:
    - label: "ターゲットに寄り添ったカラー・ビジュアル設計"
      text: "20〜40代の動物好きな女性をターゲットに設定。店名である桜をイメージさせるサーモンピンク、落ち着きを感じさせるブルーグリーン、そして全体を優しく包むベージュの3色をベースに配色しました。"
    - label: "「お店の強み」を正しく伝える情報設計"
      text: "「猫カフェ特有の衛生面への抵抗」という潜在的なハードルを下げるため、猫広場とティールームが完全に分かれているという店舗最大の強みをファーストビュー以降で明確に提示しました。"
    - label: "バックエンド視点を活かしたJekyllへの移行"
      text: "初期のHTML/CSS実装から、保守性と拡張性を高めるためにJekyllへ移行しました。メニューや店舗情報などのデータ管理効率化を意識した構造にしており、将来的なEC機能拡張にも柔軟に対応できる土台を意識しています。"
