<div class="works-category-block">
  
  <h3 class="works-category-title">Web Sites</h3>

  {% for website in site.data.websites %}
  <div class="web-item">
    
    <!-- 左側：概要とサイトへのリンクボタン -->
    <div class="web-visual">
      <div class="web-link-box">
        <h4>{{ website.title }}</h4>
        <p class="web-overview">{{ website.overview }}</p>
        <p class="use-tools">使用ツール：{{ website.tools }}</p>
        <p><img src="{{ site.baseurl }}/assets/images/{{ website.mock }}" alt=""></p>
        
        <!-- 実際のサイトへのリンクボタン -->
        <a href="{{ website.url }}" target="_blank" rel="noopener" class="btn-visit-site">
          実際のWebサイトを見る <span>↗</span>
        </a>
      </div>
    </div>

    <!-- 右側：詳細なこだわりポイント -->
    <div class="web-info">
      <ul class="point-list">
        {% for point in website.points %}
        <li>
          <strong>{{ point.label }}</strong>
          <p>{{ point.text }}</p>
        </li>
        {% endfor %}
      </ul>
    </div>

  </div>
  {% endfor %}

</div>
